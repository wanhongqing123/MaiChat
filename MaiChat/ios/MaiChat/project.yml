name: MaiChat
options:
  bundleIdPrefix: com.kongshang.maichat
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.2.4"
    CURRENT_PROJECT_VERSION: "185"
targets:
  MaiChat:
    type: application
    platform: iOS
    sources:
      - path: MaiChat
        excludes:
          - MaiChatTools/MaiMobilePhotoAlbumTool.cpp
    dependencies:
      - target: MaiChatCore
    preBuildScripts:
      - name: Build MaiAgent
        script: bash "$PROJECT_DIR/scripts/build-mobile-agent.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Primary Model
        script: python3 "$PROJECT_DIR/scripts/prepare-bundled-primary-model.py" --bundle-directory "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MaiLocalModels/Primary"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(PROJECT_DIR)/scripts/prepare-bundled-primary-model.py"
          - "$(PROJECT_DIR)/BundledPrimaryModel/manifest.json"
          - "$(PROJECT_DIR)/BundledPrimaryModel/LICENSE"
          - "$(PROJECT_DIR)/BundledPrimaryModel/SOURCE.json"
          - "$(PROJECT_DIR)/BundledPrimaryModel/UPSTREAM_MODEL_CARD.md"
          - "$(PROJECT_DIR)/BundledPrimaryModel/Qwen_Qwen3.5-2B-Q4_K_M.gguf"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MaiLocalModels/Primary/manifest.json"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MaiLocalModels/Primary/LICENSE"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MaiLocalModels/Primary/SOURCE.json"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MaiLocalModels/Primary/UPSTREAM_MODEL_CARD.md"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MaiLocalModels/Primary/Qwen_Qwen3.5-2B-Q4_K_M.gguf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongshang.maichat
        INFOPLIST_FILE: MaiChat/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: MaiChat/MaiChat-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../../../MaiAgent/third_party/curl/include
        OTHER_LDFLAGS: >-
          $(inherited) $(DERIVED_FILE_DIR)/libMaiMobileAgent.a
          $(DERIVED_FILE_DIR)/MobileAgentAdapter-$(PLATFORM_NAME)-graphics/libmaichat_ffplay_hosted.dylib
          -lc++ -liconv -lz -framework Security -framework CoreFoundation
          -framework CFNetwork -framework SystemConfiguration
          -framework Foundation -framework Metal -framework MetalKit -framework Accelerate
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  MaiChatCore:
    type: framework
    platform: iOS
    sources:
      - path: MaiChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongshang.maichat.core
        GENERATE_INFOPLIST_FILE: YES
  MaiChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MaiChatUITests
    dependencies:
      - target: MaiChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MaiChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaiChatTests
      - path: MaiChat/IM/LocalChatHistoryStore.swift
      - path: MaiChat/Chat/MarkdownInlineStyling.swift
      - path: MaiChat/Chat/MessageBubbleLayout.swift
      - path: MaiChat/Chat/ComposerDraftState.swift
      - path: MaiChat/Diagnostics/RemoteDiagnosticsCoordinator.swift
      - path: MaiChat/Diagnostics/RemoteDiagnosticsView.swift
      - path: MaiChat/MaiChatTools/AIMobileSMSInbox.swift
      - path: ../../../tests/fixtures/remote-diagnostics-failure-receipts.json
        buildPhase: resources
      - path: ../../../tests/fixtures/remote-diagnostics-report.json
        buildPhase: resources
    dependencies:
      - target: MaiChatCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MaiChat:
    build:
      targets:
        MaiChat: all
        MaiChatCore: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - MaiChatUITests
  MaiChatCoreTests:
    build:
      targets:
        MaiChatCore: all
        MaiChatTests: [test]
    test:
      targets:
        - MaiChatTests
